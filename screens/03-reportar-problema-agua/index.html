<!DOCTYPE html><html lang="es"><head>

            "on-primary-fixed-variant": "#0c5216",
            "tertiary-fixed": "#ffd9e2",
            "on-error-container": "#93000a",
            "on-surface-variant": "#41493e",
            "primary-fixed": "#acf4a4",
            "on-secondary-container": "#fffbff",
            "inverse-on-surface": "#f3f0ef",
            "surface-bright": "#fcf9f8",
            "surface-dim": "#dcd9d9",
            "secondary-container": "#d93630",

          "borderRadius": {

<style>
    body {
      background-color: #F9F9F9;
      color: #111111;
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 32;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-outlined.fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 32;
    }
    button, input, [role="radio"] {
      touch-action: manipulation;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex justify-center items-start text-on-surface" style="background-color: rgb(244, 245, 247); min-height: max(884px, 100dvh);">
<!-- Mobile Viewport Container 390x844 strict simulation -->
<div class="w-full max-w-[390px] min-h-[844px] bg-[#F4F5F7] flex flex-col justify-between border-x border-[#E2E8F0] shadow-sm relative text-[#1A1A1A]">
<!-- Top Area -->
<header class="w-full"><!-- Status Strip / Step indicator -->
<div class="bg-[#EAEAEA] px-4 py-1.5 flex justify-between items-center border-b border-[#E2E8F0]">
  <span class="font-bold text-xs tracking-wider text-[#4A5568]">PASO 3 DE 3</span>
  <span class="inline-flex items-center gap-1 font-bold text-xs text-[#1B5E20]">
    <span class="material-symbols-outlined text-[16px]">verified</span>
    TURNO ACTIVO
  </span>
</div>
<!-- Top Bar: Task Navigation & Context Badge -->
<div class="min-h-[64px] px-4 py-2 flex items-center justify-between bg-white border-b border-[#E2E8F0] shadow-sm">
  <a aria-label="Volver a la pantalla anterior" class="inline-flex items-center justify-center min-h-[40px] px-3 bg-[#F4F5F7] border border-[#CBD5E1] rounded-xl text-[#1A1A1A] font-bold text-sm hover:bg-[#E2E8F0] active:scale-95 transition" href="javascript:history.back()">
    <span class="material-symbols-outlined text-[20px] mr-1">arrow_back</span>
    <span class="">Volver</span>
  </a>
  <h1 class="text-lg font-bold text-[#1A1A1A] tracking-tight mx-2">
    Aviso al Tomero
  </h1>
  <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-[#E2E8F0] text-[#334155] border border-[#CBD5E1] whitespace-nowrap">
    Hijuela San Martín
  </span>
</div></header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile pt-space-md pb-space-lg flex flex-col justify-start"><!-- Primary Instruction -->
<div class="mb-3 px-1">
  <p class="text-base font-bold text-[#1A1A1A]">
    Seleccione lo que ocurrió en su hijuela:
  </p>
</div>

<!-- Incident Options: 3 Stacked Cards -->
<form aria-label="Tipos de problema en la hijuela" class="flex flex-col gap-3" id="water-report-form" role="radiogroup">
  <!-- Card 1: Default Non-selected -->
  <label class="incident-card cursor-pointer bg-white border border-[#E2E8F0] rounded-2xl p-4 flex items-start gap-3.5 min-h-[72px] hover:border-gray-300 transition-all shadow-sm" for="inc-1">
    <input class="sr-only" id="inc-1" name="incident_type" onchange="updateRadioSelection(this)" type="radio" value="sin_agua">
    <div class="radio-box w-7 h-7 rounded-lg border-2 border-gray-400 flex items-center justify-center bg-white flex-shrink-0 mt-0.5">
      <span class="material-symbols-outlined text-[20px] text-white opacity-0 radio-check font-bold">check</span>
    </div>
    <div class="flex-1">
      <div class="flex items-center gap-1.5 mb-1">
        <span class="material-symbols-outlined text-[#B51A1B] text-[22px] flex-shrink-0">block</span>
        <span class="font-bold text-[#1A1A1A] text-base leading-tight">
          No llegó el agua a mi compuerta
        </span>
      </div>
      <p class="text-sm text-[#4A5568] leading-snug">
        La dotación programada no ingresó al lote
      </p>
    </div>
  </label>

  <!-- Card 2: Selected State (Active soft green bg #E8F5E9 and 2px #1B5E20 border) -->
  <label class="incident-card cursor-pointer bg-[#E8F5E9] border-2 border-[#1B5E20] rounded-2xl p-4 flex items-start gap-3.5 min-h-[72px] transition-all shadow-sm" for="inc-2">
    <input checked="" class="sr-only" id="inc-2" name="incident_type" onchange="updateRadioSelection(this)" type="radio" value="canal_roto">
    <div class="radio-box w-7 h-7 rounded-lg border-2 border-[#1B5E20] flex items-center justify-center bg-[#1B5E20] flex-shrink-0 mt-0.5">
      <span class="material-symbols-outlined text-[20px] text-white radio-check font-bold" style="font-variation-settings: 'FILL' 1;">check</span>
    </div>
    <div class="flex-1">
      <div class="flex items-center gap-1.5 mb-1">
        <span class="material-symbols-outlined text-[#1B5E20] text-[22px] flex-shrink-0" style="font-variation-settings: 'FILL' 1;">water_drop</span>
        <span class="font-bold text-[#1B5E20] text-base leading-tight">
          Canal roto o desbordado
        </span>
      </div>
      <p class="text-sm text-[#1A1A1A] leading-snug">
        Pérdida de caudal o desborde en el tramo
      </p>
    </div>
  </label>

  <!-- Card 3: Non-selected -->
  <label class="incident-card cursor-pointer bg-white border border-[#E2E8F0] rounded-2xl p-4 flex items-start gap-3.5 min-h-[72px] hover:border-gray-300 transition-all shadow-sm" for="inc-3">
    <input class="sr-only" id="inc-3" name="incident_type" onchange="updateRadioSelection(this)" type="radio" value="corte_anticipado">
    <div class="radio-box w-7 h-7 rounded-lg border-2 border-gray-400 flex items-center justify-center bg-white flex-shrink-0 mt-0.5">
      <span class="material-symbols-outlined text-[20px] text-white opacity-0 radio-check font-bold">check</span>
    </div>
    <div class="flex-1">
      <div class="flex items-center gap-1.5 mb-1">
        <span class="material-symbols-outlined text-[#1A1A1A] text-[22px] flex-shrink-0">hourglass_bottom</span>
        <span class="font-bold text-[#1A1A1A] text-base leading-tight">
          Cortaron el agua antes de hora
        </span>
      </div>
      <p class="text-sm text-[#4A5568] leading-snug">
        Menos horas de dotación que las asignadas
      </p>
    </div>
  </label>

  <!-- Camera Box: Dashed gray outline button with camera icon -->
  <div class="mt-1">
    <button class="w-full min-h-[56px] p-4 rounded-2xl border-2 border-dashed border-gray-300 bg-white flex items-center justify-center gap-2.5 font-bold text-base text-[#1A1A1A] hover:bg-gray-50 active:bg-gray-100 transition shadow-sm" id="camera-btn" onclick="triggerCameraFeedback()" type="button">
      <span class="material-symbols-outlined text-[26px] text-[#4A5568]">photo_camera</span>
      <span class="">Sacar foto del canal (Opcional)</span>
    </button>
    <div class="hidden mt-1.5 text-center font-bold text-xs text-[#1B5E20] bg-[#E8F5E9] py-1.5 rounded-lg border border-[#A5D6A7]" id="photo-confirmation">
      ✓ 1 foto adjunta lista para enviar
    </div>
  </div>
</form></main>
<!-- Bottom Actions Container & Offline Guarantee Banner -->
<footer class="w-full px-4 pt-3 pb-6 bg-[#F4F5F7] border-t border-[#E2E8F0]">
  <!-- Primary Send Button -->
  <button class="w-full h-[56px] bg-[#1B5E20] hover:bg-[#154a1a] active:bg-[#0e3312] text-white rounded-xl flex items-center justify-center gap-2 transition shadow cursor-pointer font-bold text-lg tracking-wide" form="water-report-form" type="submit">
    <span class="material-symbols-outlined text-[26px] text-white">send</span>
    <span class="">ENVIAR AVISO</span>
  </button>
  <!-- Offline Guarantee Pill Badge / Helper text -->
  <div class="mt-3 bg-white border border-[#CBD5E1] rounded-xl p-3 flex items-center gap-2.5 shadow-sm">
    <span class="material-symbols-outlined text-[#1B5E20] text-[22px] flex-shrink-0" style="font-variation-settings: 'FILL' 1;">wifi_off</span>
    <p class="text-xs text-[#1A1A1A] font-medium leading-snug">
      Se guardará en el teléfono y se enviará al volver a tener señal.
    </p>
  </div>
</footer>
</div>
<script>
    function updateRadioSelection(selectedInput) {
      const cards = document.querySelectorAll('.incident-card');
      cards.forEach(card => {
        const radio = card.querySelector('input[type="radio"]');
        const box = card.querySelector('.radio-box');
        const check = card.querySelector('.radio-check');
        const subtitle = card.querySelector('p');

        if (radio.checked) {
          card.classList.remove('border-2', 'border-on-surface');
          card.classList.add('border-[3px]', 'border-primary-container', 'ring-2', 'ring-primary-container/20');
          box.classList.remove('border-on-surface', 'bg-white');
          box.classList.add('border-primary-container', 'bg-primary-container');
          check.classList.remove('opacity-0');
          check.style.fontVariationSettings = "'FILL' 1";
          if (subtitle) {
            subtitle.classList.remove('text-on-surface-variant');
            subtitle.classList.add('text-on-surface');
          }
        } else {
          card.classList.remove('border-[3px]', 'border-primary-container', 'ring-2', 'ring-primary-container/20');
          card.classList.add('border-2', 'border-on-surface');
          box.classList.remove('border-primary-container', 'bg-primary-container');
          box.classList.add('border-on-surface', 'bg-white');
          check.classList.add('opacity-0');
          check.style.fontVariationSettings = "'FILL' 0";
          if (subtitle) {
            subtitle.classList.add('text-on-surface-variant');
            subtitle.classList.remove('text-on-surface');
          }
        }
      });
    }

    function triggerCameraFeedback() {
      const confirmation = document.getElementById('photo-confirmation');
      const btn = document.getElementById('camera-btn');
      if (confirmation.classList.contains('hidden')) {
        confirmation.classList.remove('hidden');
        btn.classList.add('bg-surface-container');
      } else {
        confirmation.classList.add('hidden');
        btn.classList.remove('bg-surface-container');
      }
    }

    document.getElementById('water-report-form').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Aviso registrado con éxito. Se transmitirá al Tomero asignado inmediatamente.');
    });
  </script>


</body></html>
